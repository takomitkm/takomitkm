name: Update README cards

on:
  schedule:
    # UTC 20:00 == Asia/Taipei 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # The bot's card commit touches only profile/*.svg, so ignoring that
    # path prevents the workflow from ever re-triggering itself.
    paths-ignore:
      - "profile/**"

# Collapse overlapping runs: a newer push supersedes an in-flight card build,
# so two jobs never race to push to the same branch.
concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # The bot's own card commit must never re-trigger this workflow.
    # Actor-based (not message-based) so it also holds if the message is
    # edited later; schedule/dispatch always run.
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=true&show_icons=true&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage,all_time_contribs&theme=buefy
          path: profile/stats.svg
          core_version: 2.3.0
          token: ${{ secrets.STATS_PAT }}

      - name: Install card renderer core (public-data path)
        run: |
          mkdir -p "$RUNNER_TEMP/cardcore"
          npm install --prefix "$RUNNER_TEMP/cardcore" --no-save --ignore-scripts \
            @stats-organization/github-readme-stats-core@2.3.0

      # 语言卡改走公开数据：个人公开库 + CARD_ORGS 里显式列出的 org 公开库。
      # 上游的 affiliations 按"访问者"解析，bot 身份拿不到组织仓库，故不复用它的取数；
      # 渲染仍用上游 renderTopLanguages，观感一致。私有库因为 bot token 读不到，天然被排除。
      # 需要新增组织时只改 CARD_ORGS。
      - name: Generate top languages card (public repos only)
        env:
          GH_TOKEN: ${{ github.token }}
          CARD_USER: ${{ github.repository_owner }}
          CARD_ORGS: WCIS-Team
          CARD_OUT: profile/top-langs.svg
          CORE_DIR: ${{ runner.temp }}/cardcore/node_modules/@stats-organization/github-readme-stats-core
          LANGS_COUNT: "8"
        run: node .github/scripts/top-langs-public.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          # Nothing changed -> stop cleanly instead of failing the run.
          if git diff --cached --quiet; then
            echo "Cards unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update README cards"
          git push
