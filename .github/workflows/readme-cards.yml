name: Update README cards

on:
  schedule:
    # UTC 20:00 == Asia/Taipei 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # The bot's card commit touches only profile/*.svg, so ignoring that
    # path prevents the workflow from ever re-triggering itself.
    paths-ignore:
      - "profile/**"

# Collapse overlapping runs: a newer push supersedes an in-flight card build,
# so two jobs never race to push to the same branch.
concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # The bot's own card commit must never re-trigger this workflow.
    # Actor-based (not message-based) so it also holds if the message is
    # edited later; schedule/dispatch always run.
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=true&include_all_time_contribs=true&count_private=true&owner_affiliations=OWNER,COLLABORATOR,ORGANIZATION_MEMBER&show_icons=true&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage&theme=buefy
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&owner_affiliations=OWNER,COLLABORATOR,ORGANIZATION_MEMBER&layout=compact&theme=buefy&exclude_repo=github-readme-stats&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          # Nothing changed -> stop cleanly instead of failing the run.
          if git diff --cached --quiet; then
            echo "Cards unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update README cards"
          git push
